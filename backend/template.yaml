AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: tiny-url backend API

Globals:
  Function:
    Timeout: 10
    Runtime: nodejs20.x
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        TABLE_NAME: !Ref UrlMappingsTable

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  UrlMappingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "tiny-url-mappings-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: shortCode
          AttributeType: S
      KeySchema:
        - AttributeName: shortCode
          KeyType: HASH
      Tags:
        - Key: Project
          Value: tiny-url
        - Key: Environment
          Value: !Ref Environment

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: health.handler
      CodeUri: .
      Runtime: nodejs20.x
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
        EntryPoints:
          - src/handlers/health.ts

  ShortenFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: shorten.handler
      CodeUri: .
      Runtime: nodejs20.x
      Events:
        Shorten:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/shorten
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UrlMappingsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
        EntryPoints:
          - src/handlers/shorten.ts

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  TableName:
    Description: DynamoDB table name
    Value: !Ref UrlMappingsTable
  TableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt UrlMappingsTable.Arn
